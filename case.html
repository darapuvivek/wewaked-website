<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050403" />
<title>The Marchetti Case — Wewaked</title>
<meta name="description" content="An interrogation. Three suspects, one room, and a house that recorded everything." />
<link rel="stylesheet" href="site.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%8D%3C/text%3E%3C/svg%3E" />

<style>
html,body{height:100%;overflow:hidden;background:#050403}

.stage{
  position:fixed;inset:var(--nav-h) 0 0 0;
  display:flex;flex-direction:column;
}
body.immersive .stage{inset:0}
body.immersive .nav{display:none}

/* ─────────────────────────────────────────── the room */
.scene{position:relative;flex:0 0 50%;min-height:0;overflow:hidden;background:#050403}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.grain{
  position:absolute;inset:-40%;pointer-events:none;z-index:3;opacity:.12;
  background-image:var(--noise);background-size:180px 180px;
  animation:grain .9s steps(4) infinite;mix-blend-mode:overlay;
}
@keyframes grain{
  0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}
  50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-2%)}100%{transform:translate(0,0)}
}
.nogl-msg{
  position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;
  background:radial-gradient(70% 60% at 50% 30%,#3a2a17,#100a05 60%,#000);
  font-size:14px;color:var(--text-2);
}
.scene.nogl .nogl-msg{display:grid}

/* suspects, top-left */
.suspects{position:absolute;top:14px;left:14px;z-index:4;display:flex;gap:7px}
.stab{
  display:flex;align-items:center;gap:9px;padding:6px 12px 6px 6px;border-radius:980px;
  background:rgba(0,0,0,.46);border:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transition:background .2s ease,border-color .2s ease,transform .12s ease;
}
.stab:hover{background:rgba(0,0,0,.66)}
.stab:active{transform:scale(.98)}
.stab[aria-selected="true"]{background:rgba(10,132,255,.24);border-color:rgba(10,132,255,.55)}
.stab-face{width:26px;height:26px;border-radius:50%;overflow:hidden;flex:0 0 auto;background:#15161a}
.stab-face svg{width:100%;height:100%;display:block}
.stab-name{font-size:12.5px;font-weight:560;letter-spacing:-.01em;white-space:nowrap}
.stab-brk{font-size:10px;color:var(--amber);letter-spacing:.05em}
@media(max-width:720px){.stab-name{display:none}.stab{padding:6px}}

/* composure, top-right */
.meter{
  position:absolute;top:14px;right:14px;z-index:4;text-align:right;
  background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.12);border-radius:14px;
  padding:9px 13px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);min-width:172px;
}
.meter-who{font-size:12.5px;font-weight:590;letter-spacing:-.01em}
.meter-role{font-size:10.5px;color:var(--text-3);margin-bottom:7px}
.meter-row{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.meter-lbl{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
.meter-track{width:74px;height:5px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.meter-fill{display:block;height:100%;border-radius:3px;background:var(--green);transition:width .5s cubic-bezier(.2,.8,.25,1),background .5s ease}
.meter-val{font-size:11px;color:var(--text-2);font-variant-numeric:tabular-nums;min-width:26px}

/* what they just said */
.dialogue{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:2;
  width:100%;padding:38px 8% 16px;text-align:center;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.55) 46%,rgba(0,0,0,.85));
}
.dialogue-q{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--amber);min-height:14px;margin-bottom:8px}
.dialogue-a{
  font-family:var(--serif);font-size:clamp(15px,1.75vw,20px);line-height:1.5;color:#f4efe7;
  text-shadow:0 2px 26px #000,0 1px 3px #000;max-width:900px;margin-inline:auto;
}

.imm-btn{
  position:absolute;bottom:12px;right:14px;z-index:5;
  background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.13);border-radius:9px;
  padding:6px 10px;font-size:11.5px;color:var(--text-2);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.imm-btn:hover{color:var(--text);background:rgba(0,0,0,.66)}

/* ─────────────────────────────────────────── the desk */
.desk{
  position:relative;flex:1 1 auto;min-height:0;overflow:hidden;
  background:
    radial-gradient(58% 120% at 50% -18%,rgba(255,190,112,.34),transparent 60%),
    linear-gradient(180deg,#31220f 0%,#241809 26%,#160e06 62%,#0d0804 100%);
  border-top:1px solid rgba(255,196,120,.16);
  box-shadow:inset 0 22px 40px -22px rgba(0,0,0,.9);
  touch-action:none;
}
/* plank seams and grain */
.desk::before{
  content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:
    repeating-linear-gradient(90deg,transparent 0 118px,rgba(0,0,0,.42) 118px 121px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 3px,transparent 3px 9px);
}
.desk::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(75% 90% at 50% 0%,transparent 32%,rgba(0,0,0,.72) 100%);
}
.desk-seam{
  position:absolute;left:0;right:0;top:0;height:56px;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);
}
.desk-hint{
  position:absolute;left:50%;bottom:9px;transform:translateX(-50%);z-index:1;
  font-size:11px;color:rgba(255,214,170,.34);letter-spacing:.02em;pointer-events:none;text-align:center;
}

/* ─────────────────────────────────────────── objects on the desk */
.items{position:absolute;inset:0;z-index:2}
.item{
  position:absolute;transform:translate(-50%,-50%) scale(var(--is,1));
  cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  filter:drop-shadow(0 10px 14px rgba(0,0,0,.72));
  transition:filter .2s ease;
}
.item:hover{filter:drop-shadow(0 14px 20px rgba(0,0,0,.85)) brightness(1.1)}
.item.dragging{cursor:grabbing;filter:drop-shadow(0 26px 34px rgba(0,0,0,.9)) brightness(1.14);z-index:40}
.item svg{display:block;pointer-events:none}
.item-lbl{
  position:absolute;left:50%;top:calc(100% + 5px);transform:translateX(-50%);
  font-size:10.5px;color:rgba(255,222,180,.62);white-space:nowrap;pointer-events:none;
  letter-spacing:.02em;
}
.item-badge{
  position:absolute;top:-5px;right:-7px;min-width:18px;height:18px;border-radius:9px;
  background:var(--red);color:#fff;font-size:10.5px;font-weight:640;
  display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px rgba(0,0,0,.6);
  pointer-events:none;
}

/* ─────────────────────────────────────────── sheets laid on the desk */
.sheets{position:absolute;inset:0;z-index:30;pointer-events:none}
.sheet{
  position:absolute;pointer-events:auto;width:min(360px,74vw);max-height:63%;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#f0e9d9,#ddd3bd);
  color:#241d12;border-radius:4px;
  box-shadow:0 26px 46px -14px rgba(0,0,0,.86),0 0 0 1px rgba(0,0,0,.5);
  animation:sheetIn .26s cubic-bezier(.2,.9,.25,1);
}
@keyframes sheetIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.sheet.dark{background:linear-gradient(180deg,#22242a,#16181d);color:#e8e8ea}
.sheet-bar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 12px;cursor:grab;touch-action:none;flex:0 0 auto;
  border-bottom:1px solid rgba(0,0,0,.16);
}
.sheet.dark .sheet-bar{border-bottom-color:rgba(255,255,255,.10)}
.sheet-bar.dragging{cursor:grabbing}
.sheet-ttl{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;opacity:.66}
.sheet-x{
  width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  font-size:14px;line-height:1;opacity:.5;flex:0 0 auto;
}
.sheet-x:hover{opacity:1;background:rgba(0,0,0,.10)}
.sheet.dark .sheet-x:hover{background:rgba(255,255,255,.12)}
.sheet-body{padding:11px 12px 13px;overflow-y:auto;overscroll-behavior:contain}

/* questions */
.qs{display:grid;gap:6px}
.q{
  display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;
  width:100%;padding:9px 10px;border-radius:6px;font-size:13.5px;line-height:1.35;
  background:rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.10);color:inherit;
  transition:background .16s ease,transform .1s ease;
}
.q:hover:not(:disabled){background:rgba(0,0,0,.11)}
.q:active:not(:disabled){transform:scale(.994)}
.q:disabled{opacity:.4;cursor:not-allowed}
.q-t{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;opacity:.5;flex:0 0 auto}
.q-t.hot{color:#a52016;opacity:.85}
.q-empty{font-size:13px;opacity:.6;padding:8px 2px;line-height:1.5}
.q-locked{font-size:12px;opacity:.55;padding:8px 2px;line-height:1.5;border-top:1px solid rgba(0,0,0,.12);margin-top:4px}

/* evidence */
.ev-list{display:grid;gap:7px}
.ev-row{
  text-align:left;width:100%;padding:9px 10px;border-radius:6px;
  background:rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.10);color:inherit;
}
.ev-row:hover:not(.locked){background:rgba(0,0,0,.11)}
.ev-row.locked{opacity:.45;cursor:default}
.ev-n{font-size:13px;font-weight:640;letter-spacing:-.005em}
.ev-s{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.55;margin-top:1px}

/* an evidence card pulled out onto the desk */
.card{
  position:absolute;pointer-events:auto;width:min(268px,66vw);
  background:linear-gradient(180deg,#f4efe1,#e2d8c2);color:#241d12;
  border-radius:3px;padding:12px 13px 13px;cursor:grab;touch-action:none;
  box-shadow:0 20px 34px -12px rgba(0,0,0,.82),0 0 0 1px rgba(0,0,0,.45);
  animation:sheetIn .24s cubic-bezier(.2,.9,.25,1);
}
.card.dragging{cursor:grabbing;box-shadow:0 34px 50px -14px rgba(0,0,0,.9),0 0 0 1px rgba(0,0,0,.5)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card-n{font-size:12.5px;font-weight:700;letter-spacing:-.005em;line-height:1.3}
.card-s{font-size:9px;letter-spacing:.09em;text-transform:uppercase;opacity:.55;margin-top:2px}
.card-d{font-family:var(--serif);font-size:12.5px;line-height:1.5;margin-top:7px}
.card-x{font-size:14px;line-height:1;opacity:.42;flex:0 0 auto}
.card-x:hover{opacity:1}

/* transcript + timeline */
.log{display:grid;gap:11px;font-size:13px}
.log-q{font-size:11px;letter-spacing:.02em;opacity:.62;margin-bottom:2px}
.log-a{font-family:var(--serif);line-height:1.5}
.log-sys{font-size:11.5px;opacity:.7;font-style:italic}
.log-empty{font-size:13px;opacity:.6}
.tl-row{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.10)}
.sheet.dark .tl-row{border-bottom-color:rgba(255,255,255,.09)}
.tl-row:last-child{border-bottom:0}
.tl-t{font-size:11.5px;font-variant-numeric:tabular-nums;opacity:.72;font-weight:600}
.tl-e{font-size:12.5px;line-height:1.45;opacity:.85}

.acts{display:grid;gap:6px}
.act{
  text-align:left;width:100%;padding:9px 10px;border-radius:6px;font-size:13px;
  background:rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.10);color:inherit;
}
.act:hover:not(:disabled){background:rgba(0,0,0,.11)}
.act:disabled{opacity:.4;cursor:not-allowed}
.act.warn{background:rgba(165,32,22,.12);border-color:rgba(165,32,22,.3);font-weight:600}

.modal p{font-family:var(--serif);font-size:15.5px;line-height:1.66;color:var(--text-2);margin-bottom:13px}
.vtag{display:inline-block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;padding:5px 12px;border-radius:980px;margin-bottom:14px;font-weight:590}
.vtag.right{background:rgba(48,209,88,.16);color:var(--green)}
.vtag.wrong{background:rgba(255,69,58,.16);color:var(--red)}
.accuse{display:grid;gap:9px;margin-top:8px}

@media(max-width:820px){
  .scene{flex:0 0 44%}
  .meter{min-width:0;padding:7px 10px}
  .meter-role{display:none}
}
@media(max-width:700px){
  /* seven objects will not fit one row at this width — shrink them and
     let renderItems lay them out over two */
  .items{--is:.62}
  .item-lbl{font-size:9.5px}
  .sheet{max-height:52%;width:min(300px,86vw)}
  .imm-btn{bottom:auto;top:56px;right:12px;padding:5px 8px;font-size:10.5px}
  .desk-hint{display:none}
}
</style>

<body>
<header data-nav></header>

<div class="stage" id="stage">
  <section class="scene" id="scene">
    <canvas id="gl"></canvas>
    <div class="nogl-msg">This browser could not start WebGL, so the room can't be drawn. Everything else still works — the desk below is fully usable.</div>
    <div class="suspects" id="suspects" role="tablist" aria-label="Suspects"></div>
    <div class="meter">
      <div class="meter-who" id="m-who"></div>
      <div class="meter-role" id="m-role"></div>
      <div class="meter-row">
        <span class="meter-lbl">Composure</span>
        <span class="meter-track"><span class="meter-fill" id="m-fill"></span></span>
        <span class="meter-val" id="m-val"></span>
      </div>
    </div>
    <div class="dialogue">
      <div class="dialogue-q" id="d-q"></div>
      <div class="dialogue-a" id="d-a"></div>
    </div>
    <button class="imm-btn" id="imm" type="button">Full screen</button>
    <div class="grain"></div>
  </section>

  <section class="desk" id="desk">
    <div class="desk-seam"></div>
    <div class="items" id="items"></div>
    <div class="sheets" id="sheets"></div>
    <div class="desk-hint" id="hint">Drag anything. Click to open it.</div>
  </section>
</div>

<div class="scrim" id="scrim">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="v-title">
    <span class="vtag" id="v-tag"></span>
    <h3 id="v-title"></h3>
    <div id="v-body"></div>
    <div style="display:flex;gap:9px;margin-top:22px;flex-wrap:wrap" id="v-acts">
      <button class="btn primary" id="v-close" type="button">Close</button>
      <button class="btn" id="v-restart" type="button">Start over</button>
    </div>
  </div>
</div>

<script src="https://cdn.auth0.com/js/auth0-spa-js/2.18/auth0-spa-js.production.js"></script>
<script src="site.js"></script>
<script src="case-data.js"></script>
<script src="case-gl.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = WW.esc;
const C = window.CASE;
const suspectOf  = id => C.suspects.find(s => s.id === id);
const evidenceOf = id => C.evidence.find(e => e.id === id);

document.documentElement.style.setProperty('--noise',
  `url("data:image/svg+xml;utf8,${encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180">' +
    '<filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>' +
    '<feColorMatrix type="saturate" values="0"/></filter>' +
    '<rect width="180" height="180" filter="url(#n)" opacity="0.55"/></svg>')}")`);

/* ══════════════════════════════════════════════════ state */
let state;
function freshState(){
  const per = {};
  C.suspects.forEach(s => { per[s.id] = { composure:100, rapport:0, asked:[], broken:false }; });
  return {
    active: C.suspects[0].id,
    per,
    unlocked: C.evidence.filter(e => e.source === 'file').map(e => e.id),
    labQueue: C.evidence.filter(e => e.source === 'lab').map(e => e.id),
    log: [],
    closed: false,
  };
}
const me      = () => state.per[state.active];
const moodOf  = id => 1 - (state.per[id].composure / 100);
const isOpen  = id => state.unlocked.indexOf(id) !== -1;
const wasAsked= (st, qid) => st.asked.indexOf(qid) !== -1;

/* what the desk looks like is remembered, but the case itself restarts clean */
const LAYOUT_KEY = 'case:layout';
let layout = WW.store.get(LAYOUT_KEY, {});
const saveLayout = WW.debounce(() => WW.store.set(LAYOUT_KEY, layout), 350);

/* ══════════════════════════════════════════════════ desk objects */
const ART = {
  notepad:`<svg width="104" height="122" viewBox="0 0 104 122" fill="none">
    <rect x="4" y="8" width="96" height="110" rx="4" fill="#0d0906" opacity=".5"/>
    <rect x="2" y="4" width="96" height="110" rx="4" fill="#efe7d2"/>
    <rect x="2" y="4" width="96" height="110" rx="4" fill="url(#np)"/>
    <rect x="2" y="4" width="96" height="15" rx="4" fill="#c9bda0"/>
    <g fill="#6d6350" opacity=".62">
      <rect x="13" y="30" width="60" height="3" rx="1.5"/>
      <rect x="13" y="42" width="72" height="3" rx="1.5"/>
      <rect x="13" y="54" width="52" height="3" rx="1.5"/>
      <rect x="13" y="66" width="68" height="3" rx="1.5"/>
      <rect x="13" y="78" width="44" height="3" rx="1.5"/>
      <rect x="13" y="90" width="62" height="3" rx="1.5"/>
    </g>
    <circle cx="24" cy="11" r="3" fill="#7d735c"/><circle cx="50" cy="11" r="3" fill="#7d735c"/>
    <circle cx="76" cy="11" r="3" fill="#7d735c"/>
    <defs><linearGradient id="np" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset="1" stop-color="#000" stop-opacity=".16"/>
    </linearGradient></defs></svg>`,

  folder:`<svg width="132" height="98" viewBox="0 0 132 98" fill="none">
    <ellipse cx="66" cy="90" rx="58" ry="7" fill="#000" opacity=".5"/>
    <path d="M8 20h44l8 10h64v54a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4z" fill="#8a7549"/>
    <rect x="16" y="26" width="100" height="52" rx="2" fill="#efe9da"/>
    <rect x="22" y="34" width="54" height="3.4" rx="1.7" fill="#6b5c44" opacity=".8"/>
    <rect x="22" y="43" width="70" height="2.8" rx="1.4" fill="#8a7b62" opacity=".7"/>
    <rect x="22" y="51" width="62" height="2.8" rx="1.4" fill="#8a7b62" opacity=".7"/>
    <path d="M6 30h48l8 10h64a4 4 0 0 1 4 4v42a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z" fill="#a68f5c"/>
    <path d="M6 30h48l8 10h64a4 4 0 0 1 4 4v42a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z" fill="url(#fg)"/>
    <rect x="86" y="52" width="34" height="16" rx="2" fill="#a5342a" opacity=".9"/>
    <defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset="1" stop-color="#000" stop-opacity=".22"/>
    </linearGradient></defs></svg>`,

  phone:`<svg width="122" height="84" viewBox="0 0 122 84" fill="none">
    <ellipse cx="61" cy="76" rx="50" ry="7" fill="#000" opacity=".5"/>
    <rect x="16" y="34" width="90" height="32" rx="7" fill="#1b1c20"/>
    <rect x="16" y="34" width="90" height="32" rx="7" fill="url(#pg)"/>
    <rect x="26" y="43" width="70" height="4" rx="2" fill="#0e0f12"/>
    <rect x="26" y="52" width="70" height="4" rx="2" fill="#0e0f12"/>
    <rect x="10" y="14" width="102" height="19" rx="9.5" fill="#26282e"/>
    <rect x="10" y="14" width="102" height="19" rx="9.5" fill="url(#pg)"/>
    <rect x="10" y="14" width="21" height="19" rx="9.5" fill="#141519"/>
    <rect x="91" y="14" width="21" height="19" rx="9.5" fill="#141519"/>
    <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient></defs></svg>`,

  recorder:`<svg width="112" height="74" viewBox="0 0 112 74" fill="none">
    <ellipse cx="56" cy="66" rx="45" ry="6" fill="#000" opacity=".5"/>
    <rect x="10" y="20" width="92" height="42" rx="6" fill="#23252b"/>

/* ══════════════════════════════════════════════════ drag
 * One handler for every draggable thing on the desk. Positions are stored as
 * percentages of the desk box so they survive a resize. A short movement
 * threshold keeps a click from being swallowed by the drag.
 */
function draggable(el, handle, onMove, onClick){
  let id = null, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;

  handle.addEventListener('pointerdown', e => {
    if(e.button !== 0 && e.pointerType === 'mouse') return;
    if(e.target.closest('[data-noDrag]')) return;
    id = e.pointerId; moved = false;
    sx = e.clientX; sy = e.clientY;
    ox = parseFloat(el.dataset.x); oy = parseFloat(el.dataset.y);
    handle.setPointerCapture(id);
    el.classList.add('dragging'); handle.classList.add('dragging');
    el.style.zIndex = String(++draggable.top);
    e.preventDefault();
  });

  handle.addEventListener('pointermove', e => {
    if(e.pointerId !== id) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if(!moved && Math.hypot(dx, dy) < 4) return;
    moved = true;
    const box = $('desk').getBoundingClientRect();
    onMove(ox + (dx / box.width) * 100, oy + (dy / box.height) * 100);
  });

  const end = e => {
    if(e.pointerId !== id) return;
    handle.releasePointerCapture(id);
    id = null;
    el.classList.remove('dragging'); handle.classList.remove('dragging');
    if(!moved && onClick) onClick();
  };
  handle.addEventListener('pointerup', end);
  handle.addEventListener('pointercancel', end);
}
draggable.top = 40;

function placeItem(el, x, y){
  x = Math.max(4, Math.min(96, x));
  y = Math.max(8, Math.min(92, y));
  el.dataset.x = x; el.dataset.y = y;
  el.style.left = x + '%'; el.style.top = y + '%';
}
function placeSheet(el, x, y){
  x = Math.max(0, Math.min(86, x));
  y = Math.max(0, Math.min(66, y));
  el.dataset.x = x; el.dataset.y = y;
  el.style.left = x + '%'; el.style.top = y + '%';
}

/* ══════════════════════════════════════════════════ items on the desk */
function renderItems(){
  const host = $('items');
  host.innerHTML = '';
  ITEMS.forEach(def => {
    const el = document.createElement('div');
    el.className = 'item';
    el.id = 'item-' + def.id;
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.setAttribute('aria-label', def.label);
    el.innerHTML = ART[def.art] +
      `<span class="item-lbl">${esc(def.label)}</span>` +
      (def.badge ? `<span class="item-badge" id="lab-badge">${state.labQueue.length}</span>` : '');
    host.appendChild(el);

    const saved = layout['i:' + def.id];
    const home = narrow() ? MOBILE_HOME[def.id] : def;
    placeItem(el, saved ? saved.x : home.x, saved ? saved.y : home.y);

    draggable(el, el,
      (x, y) => { placeItem(el, x, y); layout['i:' + def.id] = { x:+el.dataset.x, y:+el.dataset.y }; saveLayout(); },
      () => openItem(def.id));
    el.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openItem(def.id); }
    });
  });
  syncBadge();
}

function syncBadge(){
  const b = $('lab-badge');
  if(b){ b.textContent = state.labQueue.length; b.style.display = state.labQueue.length ? 'grid' : 'none'; }
}

function openItem(id){
  if(id === 'phone')  return callLab();
  if(id === 'cigs')   return offer('cigarette');
  if(id === 'glass')  return offer('water');
  if(id === 'warrant')return openAccuse();
  if(id === 'notepad')return openSheet('questions');
  if(id === 'folder') return openSheet('file');
  if(id === 'recorder')return openSheet('tape');
}

/* ══════════════════════════════════════════════════ sheets */
const openSheets = new Map();

function openSheet(kind){
  if(openSheets.has(kind)){
    const el = openSheets.get(kind);
    el.style.zIndex = String(++draggable.top);
    el.animate([{ transform:'scale(1.02)' }, { transform:'scale(1)' }], { duration:180, easing:'ease-out' });
    return;
  }
  const spec = SHEETS[kind];
  const el = document.createElement('div');
  el.className = 'sheet' + (spec.dark ? ' dark' : '');
  el.innerHTML =
    `<div class="sheet-bar"><span class="sheet-ttl">${esc(spec.title)}</span>
       <button class="sheet-x" type="button" data-noDrag aria-label="Close">×</button></div>
     <div class="sheet-body"></div>`;
  $('sheets').appendChild(el);
  openSheets.set(kind, el);

  const saved = layout['s:' + kind];
  placeSheet(el, saved ? saved.x : spec.x, saved ? saved.y : spec.y);
  el.style.zIndex = String(++draggable.top);

  const bar = el.querySelector('.sheet-bar');
  draggable(el, bar, (x, y) => {
    placeSheet(el, x, y);
    layout['s:' + kind] = { x:+el.dataset.x, y:+el.dataset.y };
    saveLayout();
  });
  el.querySelector('.sheet-x').addEventListener('click', () => {
    el.remove(); openSheets.delete(kind);
  });
  paintSheet(kind);
}

const SHEETS = {
  questions:{ title:'Questions', x:2,  y:4  },
  file:     { title:'Case file', x:34, y:3  },
  tape:     { title:'The tape',  x:66, y:5, dark:true },
  timeline: { title:'That night',x:48, y:12 },
};

function paintSheet(kind){
  const el = openSheets.get(kind);
  if(!el) return;
  const body = el.querySelector('.sheet-body');
  if(kind === 'questions') body.innerHTML = questionsHTML();
  if(kind === 'file')      body.innerHTML = fileHTML();
  if(kind === 'tape')      body.innerHTML = tapeHTML();
  if(kind === 'timeline')  body.innerHTML = timelineHTML();
  wireSheet(kind, body);
}
function repaint(...kinds){ kinds.forEach(paintSheet); }

function wireSheet(kind, body){
  if(kind === 'questions'){
    body.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => ask(b.dataset.q)));
  }
  if(kind === 'file'){
    body.querySelectorAll('[data-ev]').forEach(b => b.addEventListener('click', () => pullCard(b.dataset.ev)));
    const t = body.querySelector('[data-timeline]');
    if(t) t.addEventListener('click', () => openSheet('timeline'));
  }
}

/* ── questions: every available one, in a stable order, asked ones removed.
   No random pool and no reshuffle, so a question never comes back. */
function questionsHTML(){
  const s = suspectOf(state.active), st = me();
  const open = s.questions.filter(q =>
    !wasAsked(st, q.id) &&
    (!q.requires || isOpen(q.requires)) &&
    (!q.rapport  || st.rapport >= q.rapport));

  const blocked = s.questions.filter(q =>
    !wasAsked(st, q.id) &&
    ((q.requires && !isOpen(q.requires)) || (q.rapport && st.rapport < q.rapport))).length;

  if(!open.length){
    return `<div class="q-empty">You have asked ${st.asked.length} of ${s.questions.length}. ` +
      (blocked
        ? `The rest needs something you do not have yet — chase the lab, or get them talking.`
        : `There is nothing left to ask ${esc(s.name.split(' ')[0])}.`) + `</div>`;
  }
  return `<div class="qs">` + open.map(q =>
    `<button class="q" type="button" data-q="${q.id}"${state.closed ? ' disabled' : ''}>
       <span>${esc(q.text)}</span>
       <span class="q-t${q.tension >= 15 ? ' hot' : ''}">${q.tension >= 15 ? 'hard' : q.tension >= 8 ? 'firm' : 'soft'}</span>
     </button>`).join('') + `</div>` +
    (blocked ? `<div class="q-locked">${blocked} more ${blocked === 1 ? 'question is' : 'questions are'} waiting on evidence you have not turned up yet.</div>` : '') +
    (st.broken ? '' : `<div class="q-locked">You can also lean on them — that costs composure and goodwill.
       <button class="act" type="button" data-noDrag id="press-btn" style="margin-top:6px">Press harder</button></div>`);
}

function fileHTML(){
  const rows = C.evidence.map(e => {
    const open = isOpen(e.id);
    const src = e.source === 'file' ? 'In the file' : e.source === 'lab' ? 'Lab' : 'Testimony';
    return `<button class="ev-row${open ? '' : ' locked'}" type="button"${open ? ` data-ev="${e.id}"` : ' disabled'}>
      <div class="ev-n">${open ? esc(e.name) : 'Not yet established'}</div>
      <div class="ev-s">${src}${open ? '' : ' · sealed'}</div>
    </button>`;
  }).join('');
  return `<div class="ev-list">${rows}</div>
    <button class="act" type="button" data-timeline style="margin-top:9px">Open the timeline of that night</button>`;
}

function tapeHTML(){
  if(!state.log.length) return `<div class="log-empty">Nothing on the record yet.</div>`;
  return `<div class="log">` + state.log.map(x =>
    x.sys ? `<div class="log-sys">${esc(x.sys)}</div>`
          : `<div><div class="log-q">${esc(x.who)}${x.q ? ' — ' + esc(x.q) : ''}</div>
               <div class="log-a">${esc(x.a)}</div></div>`).join('') + `</div>`;
}

function timelineHTML(){
  return C.timeline.map(t =>
    `<div class="tl-row"><div class="tl-t">${esc(t.time)}</div><div class="tl-e">${esc(t.event)}</div></div>`).join('');
}

/* ── an evidence card pulled out of the folder and dropped on the desk */
const cards = new Map();
function pullCard(evId){
  if(cards.has(evId)){
    const el = cards.get(evId);
    el.style.zIndex = String(++draggable.top);
    el.animate([{ transform:'scale(1.03)' }, { transform:'scale(1)' }], { duration:180, easing:'ease-out' });
    return;
  }
  const e = evidenceOf(evId);
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML =
    `<div class="card-top">
       <div><div class="card-n">${esc(e.name)}</div>
         <div class="card-s">${e.source === 'lab' ? 'Lab' : e.source === 'file' ? 'In the file' : 'Testimony'}</div></div>
       <button class="card-x" type="button" data-noDrag aria-label="Put it back">×</button>
     </div>
     <div class="card-d">${esc(e.detail)}</div>`;
  $('sheets').appendChild(el);
  cards.set(evId, el);

  const saved = layout['c:' + evId];
  const n = cards.size;
  placeSheet(el, saved ? saved.x : 24 + (n % 4) * 15, saved ? saved.y : 30 + (n % 3) * 12);
  el.style.zIndex = String(++draggable.top);

  draggable(el, el, (x, y) => {
    placeSheet(el, x, y);
    layout['c:' + evId] = { x:+el.dataset.x, y:+el.dataset.y };
    saveLayout();
  });
  el.querySelector('.card-x').addEventListener('click', () => { el.remove(); cards.delete(evId); });
}

function renderSuspects(){
  $('suspects').innerHTML = C.suspects.map(s => `
    <button class="stab" role="tab" data-id="${s.id}" aria-selected="${s.id === state.active}">

function renderMeter(){
  const s = suspectOf(state.active);
  const v = Math.max(0, Math.round(me().composure));
  $('m-who').textContent = s.name;
  $('m-role').textContent = s.role;
  $('m-fill').style.width = v + '%';
  $('m-fill').style.background = v > 65 ? 'var(--green)' : v > 30 ? 'var(--amber)' : 'var(--red)';
  $('m-val').textContent = v;
  GL.setMood(moodOf(s.id));
}

let sayToken = 0;
function say(q, a){
  const token = ++sayToken;
  $('d-q').textContent = q || '';
  const el = $('d-a'), text = String(a);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent = text; return; }
  el.textContent = '';
  let i = 0;
  (function type(){
    if(token !== sayToken) return;
    el.textContent = text.slice(0, i);
    i += 2;
    if(i <= text.length + 2) setTimeout(type, 12);
  })();
}

/* ══════════════════════════════════════════════════ actions */
function unlock(ids, note){
  let any = false;
  (ids || []).forEach(id => { if(!isOpen(id)){ state.unlocked.push(id); any = true; } });
  if(any){
    if(note) state.log.push({ sys:note });
    repaint('file', 'tape', 'questions');
  }
  return any;
}

function breakDown(s, st){
  st.broken = true;
  setTimeout(() => {
    state.log.push({ who:s.name, q:null, a:s.breakLine });
    say('They break', s.breakLine);
    const names = (s.breakReveals || []).map(id => (evidenceOf(id) || {}).name).filter(Boolean);
    unlock(s.breakReveals, names.length ? `New in the file: ${names.join(', ')}.` : null);
    renderSuspects(); repaint('tape', 'questions'); renderMeter();
  }, 2200);
}

function ask(qid){
  if(state.closed) return;
  const s = suspectOf(state.active), st = me();
  const q = s.questions.find(x => x.id === qid);
  if(!q || wasAsked(st, qid)) return;

  st.asked.push(qid);
  st.composure = Math.max(0, st.composure - q.tension);
  state.log.push({ who:s.name, q:q.text, a:q.answer });
  say(q.text, q.answer);

  if(q.reveals && q.reveals.length){
    const names = q.reveals.map(id => (evidenceOf(id) || {}).name).filter(Boolean);
    unlock(q.reveals, names.length ? `New in the file: ${names.join(', ')}.` : null);
  }
  if(st.composure <= 0 && !st.broken) breakDown(s, st);
  renderMeter(); repaint('questions', 'tape');
}

function press(){
  if(state.closed) return;
  const s = suspectOf(state.active), st = me();
  if(st.broken) return;
  st.composure = Math.max(0, st.composure - 9);
  st.rapport = Math.max(0, st.rapport - 1);
  state.log.push({ who:s.name, q:'Pressed', a:s.press });
  say('You lean in', s.press);
  if(st.composure <= 0 && !st.broken) breakDown(s, st);
  renderMeter(); repaint('questions', 'tape');
}

function offer(kind){
  if(state.closed) return;
  const s = suspectOf(state.active), st = me();
  if(st.rapport >= 2){
    say(null, kind === 'cigarette'
      ? 'The packet is already on the table between you.'
      : 'Their glass is still full.');
    return;
  }
  st.rapport++;
  st.composure = Math.min(100, st.composure + 6);
  const label = kind === 'cigarette' ? 'You slide the packet across' : 'You pour a glass';
  state.log.push({ who:s.name, q:label, a:s.offers[kind] });
  say(label, s.offers[kind]);
  renderMeter(); repaint('questions', 'tape');
}

function callLab(){
  if(state.closed) return;
  if(!state.labQueue.length){
    say('You pick up the phone', 'The lab has given you everything they have. The rest is in the room with you.');
    return;
  }
  const e = evidenceOf(state.labQueue.shift());
  state.unlocked.push(e.id);
  state.log.push({ sys:`Lab result: ${e.name}.` });
  say('The lab, on the desk phone', `${e.name}. ${e.detail}`);
  syncBadge();
  repaint('file', 'questions', 'tape');
  if(!openSheets.has('file')) WW.toast(`Lab: ${e.name}`);
}

function switchTo(id){
  if(id === state.active) return;
  state.active = id;
  renderSuspects(); renderMeter();
  GL.setSuspect(suspectOf(id));
  repaint('questions');
  say(null, suspectOf(id).opening);
}

/* ══════════════════════════════════════════════════ the arrest */
function openAccuse(){
  $('v-tag').className = 'vtag';
  $('v-tag').textContent = '';
  $('v-title').textContent = 'Who are you arresting?';
  $('v-body').innerHTML =
    `<p>Once you charge someone the file closes. Be sure the evidence carries it.</p>
     <div class="accuse">${C.suspects.map(s =>
       `<button class="btn" data-acc="${s.id}" type="button" style="text-align:left">${esc(s.name)} — ${esc(s.role)}</button>`
     ).join('')}</div>`;
  $('v-restart').style.display = 'none';
  $('scrim').classList.add('open');
  $('v-body').querySelectorAll('[data-acc]').forEach(b =>
    b.addEventListener('click', () => verdict(b.dataset.acc)));
}

function verdict(id){
  const v = C.verdicts[id];
  state.closed = true;
  $('v-tag').className = 'vtag ' + (v.correct ? 'right' : 'wrong');
  $('v-tag').textContent = v.correct ? 'Charged — and it holds' : 'Charged — and it collapses';
  $('v-title').textContent = v.title;
  $('v-body').innerHTML = v.body.map(p => `<p>${esc(p)}</p>`).join('');
  $('v-restart').style.display = '';
  $('scrim').classList.add('open');
  repaint('questions');
}

const closeModal = () => $('scrim').classList.remove('open');

function restart(){
  state = freshState();
  cards.forEach(el => el.remove()); cards.clear();
  renderSuspects(); renderMeter(); syncBadge();
  repaint('questions', 'file', 'tape');
  GL.setSuspect(suspectOf(state.active));
  say(null, suspectOf(state.active).opening);
  closeModal();
}

/* ══════════════════════════════════════════════════ boot */
const GL = CaseGL.init($('gl'));
if(!GL.ok) $('scene').classList.add('nogl');

state = freshState();
renderItems(); renderSuspects(); renderMeter();
GL.setSuspect(suspectOf(state.active));
say(null, suspectOf(state.active).opening);
openSheet('questions');

/* the press button lives inside the questions sheet, which is repainted often */
document.addEventListener('click', e => {
  if(e.target.id === 'press-btn') press();
});

$('v-close').addEventListener('click', closeModal);
$('v-restart').addEventListener('click', restart);
$('scrim').addEventListener('click', e => { if(e.target === $('scrim')) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

$('imm').addEventListener('click', async () => {
  try{
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(err){
    document.body.classList.toggle('immersive');   // fullscreen refused: hide the chrome instead
  }
});
document.addEventListener('fullscreenchange', () => {
  const on = !!document.fullscreenElement;
  document.body.classList.toggle('immersive', on);
  $('imm').textContent = on ? 'Exit full screen' : 'Full screen';
});

setTimeout(() => { const h = $('hint'); if(h) h.style.opacity = '0'; }, 7000);
$('hint').style.transition = 'opacity .8s ease';
</script>
</body>
